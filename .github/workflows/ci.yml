name: ci
on:
  push:
    branches: [main]
  pull_request:

# moindre privilège par défaut
permissions:
  contents: read

env:
  IMAGE: ghcr.io/glinprivate/garanties-api

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # tests + quality gate JaCoCo
      - run: ./mvnw -B verify

  image:
    # pas d'image si les tests échouent
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # seul ce job peut écrire dans GHCR
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (local, pas encore poussée)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Scan de vulnérabilités
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # le pipeline échoue s'il trouve une vulnérabilité
          exit-code: '1'
      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}
