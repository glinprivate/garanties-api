name: ci
on:
  push:
    branches: [main]
  pull_request:

# moindre privilège par défaut
permissions:
  contents: read

env:
  IMAGE: ghcr.io/glinprivate/garanties-api

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      # empreinte du jar, transmise au job image pour vérification
      jar-sha256: ${{ steps.jar.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # tests + quality gate JaCoCo
      - run: ./mvnw -B verify
      # build once : ce jar testé est le seul qui partira dans l'image
      - name: Empreinte du jar
        id: jar
        run: |
          sha256sum target/*.jar
          echo "sha256=$(sha256sum target/*.jar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publication du jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  image:
    # pas d'image si les tests échouent
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # seul ce job peut écrire dans GHCR
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Récupération du jar testé
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-jar
          path: dist/
      - name: Vérification de l'empreinte
        env:
          EXPECTED: ${{ needs.build-test.outputs.jar-sha256 }}
        run: |
          sha256sum dist/*.jar
          echo "attendu : $EXPECTED"
          # le pipeline échoue si le jar a changé entre les deux jobs
          echo "$EXPECTED  $(ls dist/*.jar)" | sha256sum --check
          # nom fixe attendu par Dockerfile.ci (renommer ne change pas l'empreinte)
          mv dist/*.jar dist/app.jar
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (local, pas encore poussée)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # aucune compilation ici : l'image emballe le jar reçu
          file: Dockerfile.ci
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Scan de vulnérabilités
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # le pipeline échoue s'il trouve une vulnérabilité
          exit-code: '1'
      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}
